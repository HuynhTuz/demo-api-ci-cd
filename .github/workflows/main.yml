name: Restful-Booker CI Pipeline
on: [push, pull_request]

jobs:
  api-testing:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout ma nguon
        uses: actions/checkout@v4

      - name: 2. Cai dat Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 3. Cai dat cong cu Newman
        run: npm install -g newman

      - name: 4. Chay bo Test tu dong
        # Lưu ý: Thay tên file JSON bộ sưu tập cho khớp với tên file bạn đã tải lên
        run: newman run "RestfulBooker API Collection.postman_collection.json" -e env.json -d booking_data.csv
